[project]
name = "pravachan-pipeline"
version = "0.2.0"
description = "Jain pravachan audio → transcript → OpenRouter typeset + cross-model consensus → PDF + DOCX. CLI, web app, and Claude Code skills."
requires-python = ">=3.10"
dependencies = [
    "gdown>=5.0",
    "yt-dlp>=2024.1",
    "selenium>=4.18",          # NotebookLM automation (needs Firefox + geckodriver)
    "requests>=2.31",          # OpenRouter build stage (openrouter.py)
    "weasyprint>=60",
    "python-docx>=1.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
google = ["google-cloud-speech>=2.21", "google-cloud-storage>=2.14"]   # optional STT fallback

[project.scripts]
pravachan = "pipeline:main"
pravachan-web = "webapp.server:main"
pravachan-nlm-login = "nlm:login_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pipeline", "nlm", "gstt", "openrouter"]
packages = ["webapp"]
include-package-data = true

[tool.setuptools.package-data]
webapp = ["templates/*.html"]
